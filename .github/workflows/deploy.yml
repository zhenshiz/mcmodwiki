name: Build static website for 1Panel

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcmod-wiki-static-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'zhenshiz/mcmodwiki' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: '8.12.1'
          run_install: false

      - name: Install and build
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          test -s dist/index.html
          test -d dist/assets
          test -d dist/md
          test -z "$(find dist -type l -print -quit)"

      - uses: actions/upload-artifact@v7
        with:
          name: static-website
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: github.repository == 'zhenshiz/mcmodwiki' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # This job copies files and commits them; it never installs or runs site code.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/download-artifact@v7
        with:
          name: static-website
          path: ${{ runner.temp }}/static-website

      - name: Publish built files to deploy-static
        env:
          BUILT_DIR: ${{ runner.temp }}/static-website
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s "$BUILT_DIR/index.html"
          test -d "$BUILT_DIR/assets"
          test -d "$BUILT_DIR/md"
          test -z "$(find "$BUILT_DIR" -type l -print -quit)"
          # Stop if a new top-level output needs an explicit deployment decision.
          test -z "$(find "$BUILT_DIR" -mindepth 1 -maxdepth 1 \
            ! -name index.html ! -name assets ! -name md ! -name downloads ! -name favicon.ico -print -quit)"
          remote_ref="$(git ls-remote --heads origin refs/heads/deploy-static)"
          if [[ -n "$remote_ref" ]]; then
            git fetch --no-tags origin refs/heads/deploy-static:refs/remotes/origin/deploy-static
            git switch --create deploy-static origin/deploy-static
          else
            git switch --orphan deploy-static
          fi
          git rm -r -f --ignore-unmatch .
          cp -a "$BUILT_DIR/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Built files are unchanged; keeping the current publication."
            exit 0
          fi
          git commit -m "Publish static website from $SOURCE_SHA"
          git push origin HEAD:refs/heads/deploy-static
